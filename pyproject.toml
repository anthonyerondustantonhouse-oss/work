[project]
name = "metaview-bullhorn-sync"
version = "0.1.0"
description = "Every thirty minutes, read new Metaview conversations, match them to Bullhorn records with a human confirmation gate, and write a house-style note."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mvsync = "metaview_bullhorn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metaview_bullhorn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
